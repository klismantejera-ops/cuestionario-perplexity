<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tecnología Futurista con Buscador y Filtros</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
  body {
    margin:0;
    font-family: 'Orbitron', sans-serif;
    background: radial-gradient(circle at center, #000810, #00182e 90%);
    color: #00ffff;
    display:flex;
    flex-direction: column;
    align-items: center;
    min-height:100vh;
    padding:20px 10px;
  }
  header {
    max-width: 1200px;
    width: 100%;
    margin-bottom: 20px;
    text-align: center;
  }
  h1 {
    letter-spacing: 3px;
    text-shadow: 0 0 24px #00ffff;
    margin-bottom: 10px;
  }
  #searchInput {
    width: 320px;
    max-width: 90vw;
    font-size: 1rem;
    padding: 10px 15px;
    border-radius: 20px;
    border: 2px solid #00ffff;
    background: rgba(0,30,60,0.7);
    color: #a0e9ff;
    box-shadow: 0 0 15px #00f0ffaa inset;
    margin-bottom: 12px;
    outline: none;
    transition: border-color 0.3s;
  }
  #searchInput:focus {
    border-color: #00bfff;
    box-shadow: 0 0 30px #00bfffaa inset;
  }
  .filters {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 25px;
  }
  .filter-btn {
    background: transparent;
    border: 2px solid #00ffff;
    padding: 8px 18px;
    border-radius: 15px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: #00ffff;
    cursor: pointer;
    transition: all 0.3s ease;
    user-select: none;
  }
  .filter-btn.active, .filter-btn:hover {
    background: #00f0ff;
    color: #001022;
    box-shadow: 0 0 30px #00f0ffcc;
  }
  .container {
    max-width:1400px;
    width:100%;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    grid-gap:22px;
  }
  .card {
    background:rgba(0,30,60,0.85);
    border: 2px solid #00ffff;
    border-radius:20px;
    box-shadow:
      0 0 25px #00ffffcc,
      inset 0 0 15px #00eaffaa;
    cursor:pointer;
    overflow:hidden;
    display:flex;
    flex-direction: column;
    align-items:center;
    padding:20px 16px 28px;
    transition:
      transform 0.3s ease,
      box-shadow 0.3s ease,
      border-color 0.4s ease;
    position:relative;
    user-select:none;
  }
  .card:hover {
    transform: scale(1.12);
    border-color: #00eaff;
    box-shadow:
      0 0 75px #00eaffee,
      inset 0 0 25px #00bfffcc,
      inset 0 0 40px #00eaff99;
    z-index:2;
  }
  .card svg {
    width: 90px;
    height: 90px;
    margin-bottom: 15px;
    filter: drop-shadow(0 0 6px #00ffffdd);
    pointer-events:none;
  }
  .card h3 {
    margin:0 0 8px;
    color: #00d4ff;
    text-shadow: 0 0 20px #00ffffaa;
    letter-spacing: 1.2px;
  }
  .card p {
    font-size:0.9rem;
    line-height:1.4;
    color:#8aefff;
    text-align:center;
  }
  @media(max-width:480px){
    .container {
      grid-template-columns: 1fr;
    }
    .card {
      padding: 20px 15px 25px;
    }
    .card svg {
      width: 60px;
      height: 60px;
      margin-bottom: 10px;
    }
  }
  #modal {
    transition: opacity 0.35s ease, transform 0.35s ease;
    display: flex;
    position: fixed;
    z-index: 9999;
    justify-content: center;
    align-items: center;
    top: 0; right: 0; bottom: 0; left: 0;
    background: rgba(0, 10, 15, 0.95);
    opacity: 0;
    pointer-events: none;
    transform: scale(0.95);
  }
  #modal.active {
    opacity: 1;
    pointer-events: auto;
    transform: scale(1);
  }
  #modal-content {
    background: #001f3f;
    border-radius: 24px;
    max-width: 700px;
    width: 95%;
    padding: 36px 48px;
    color: #00ffff;
    box-shadow: 0 0 80px #00bfff,
                0 0 100px #00eaff;
    position: relative;
    font-weight: 500;
    user-select: text;
    max-height: 80vh;
    overflow-y: auto;
  }
  #modal-close {
    position: absolute;
    top: 14px;
    right: 22px;
    font-size: 2.6rem;
    font-weight: 700;
    color: #00bfff;
    cursor: pointer;
    user-select: none;
    transition: color 0.3s ease;
  }
  #modal-close:hover {
    color: #00ffff;
  }
  #modal h2 {
    margin-top: 0;
    letter-spacing: 3px;
    text-align: center;
    text-shadow: 0 0 24px #00ffff;
    font-weight: 700;
  }
  #modal ul {
    list-style: none;
    padding-left: 0;
    margin-top: 22px;
  }
  #modal ul li {
    margin-bottom: 18px;
    font-size: 1.1rem;
    line-height: 1.5;
  }
  #modal ul li h3 {
    margin: 0 0 6px;
    color: #00bfff;
    font-weight: 600;
  }
  #sound-toggle {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: transparent;
    border: 2px solid #00ffff;
    border-radius: 50%;
    width: 56px;
    height: 56px;
    cursor: pointer;
    box-shadow: 0 0 20px #00ffffaa;
    transition: background-color 0.3s, border-color 0.3s;
    z-index: 10000;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #sound-toggle:hover {
    background-color: #00ffff22;
    border-color: #00ffff;
  }
  #sound-toggle svg {
    fill: #00ffff;
    width: 28px;
    height: 28px;
  }
  #sound-toggle.active svg {
    fill: #001a2e;
  }
</style>
</head>
<body>
<header>
  <h1>Tecnología Futurista Interactiva</h1>
  <input type="search" id="searchInput" aria-label="Buscar tarjetas" placeholder="Buscar tecnología..." />
  <div class="filters" role="group" aria-label="Filtros de categorías">
    <button class="filter-btn active" data-filter="all" aria-pressed="true">Todas</button>
    <button class="filter-btn" data-filter="basico" aria-pressed="false">Básico</button>
    <button class="filter-btn" data-filter="avanzado" aria-pressed="false">Avanzado</button>
    <button class="filter-btn" data-filter="redes" aria-pressed="false">Redes</button>
    <button class="filter-btn" data-filter="software" aria-pressed="false">Software</button>
    <button class="filter-btn" data-filter="hardware" aria-pressed="false">Hardware</button>
    <button class="filter-btn" data-filter="seguridad" aria-pressed="false">Seguridad</button>
  </div>
</header>
<main class="container" role="main" aria-label="Información interactiva sobre tecnología">
  <!-- Ejemplo de tarjetas actualizadas con categoría data-category para filtrar -->
  <article tabindex="0" class="card" data-category="basico hardware" data-title="Procesador (CPU)" data-detail='[
    {"title":"Función","content":"Ejecuta instrucciones y procesa datos; es el cerebro del computador."},
    {"title":"Componentes","content":"Contiene núcleos, caché y unidad de control."},
    {"title":"Importancia","content":"Determina la velocidad y capacidad."}
  ]'>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect x="14" y="14" width="36" height="36" rx="6" ry="6" fill="none" stroke="#00ffff" stroke-width="3"/></svg>
    <h3>Procesador (CPU)</h3>
    <p>Cerebro del computador.</p>
  </article>
  <article tabindex="0" class="card" data-category="basico hardware" data-title="Memoria RAM" data-detail='[
    {"title":"Definición","content":"Memoria rápida para guardar datos inmediatos y programas."},
    {"title":"Tipos comunes","content":"DDR3, DDR4 y DDR5 con diferentes velocidades y capacidades."}
  ]'>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect x="18" y="14" width="28" height="36" fill="none" stroke="#00ffff" stroke-width="4"/></svg>
    <h3>Memoria RAM</h3>
    <p>Datos para procesamiento en tiempo real.</p>
  </article>
  <article tabindex="0" class="card" data-category="avanzado software" data-title="Inteligencia Artificial (IA)" data-detail='[
    {"title":"Definición","content":"Simulación de inteligencia humana en máquinas para tareas automatizadas."},
    {"title":"Aplicaciones","content":"Reconocimiento de voz, visión artificial, robots y más."},
    {"title":"Impacto","content":"Transforma industrias y mejora procesos complejos."}
  ]'>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="32" cy="22" r="10" fill="none" stroke="#00ffff" stroke-width="3"/></svg>
    <h3>Inteligencia Artificial (IA)</h3>
    <p>Máquinas inteligentes y automatización.</p>
  </article>
  <!-- Agrega más tarjetas aquí siguiendo el patrón data-category con categorías apropiadas, por ejemplo redes, seguridad, etc -->
</main>

<button id="sound-toggle" aria-pressed="true" aria-label="Activar o desactivar efectos de sonido" title="Activar o desactivar sonido">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#00ffff" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zM16.5 12a4.5 4.5 0 0 1-8.45 2.55l1.43-1.43a3 3 0 0 0 5.6-2.35 3 3 0 0 0-1.02-2.27l-1.43-1.42A4.48 4.48 0 0 1 16.5 12z"/></svg>
</button>

<div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-desc">
  <div id="modal-content">
    <span id="modal-close" role="button" aria-label="Cerrar ventana" tabindex="0">&times;</span>
    <h2 id="modal-title"></h2>
    <ul id="modal-desc"></ul>
  </div>
</div>

<audio id="modal-sound" src="https://freesound.org/data/previews/522/522770_10951068-lq.mp3" preload="auto"></audio>

<script>
  const cards = document.querySelectorAll('.card');
  const modal = document.getElementById('modal');
  const modalTitle = document.getElementById('modal-title');
  const modalDesc = document.getElementById('modal-desc');
  const modalClose = document.getElementById('modal-close');
  const modalSound = document.getElementById('modal-sound');
  const soundToggle = document.getElementById('sound-toggle');
  const searchInput = document.getElementById('searchInput');
  const filterButtons = document.querySelectorAll('.filter-btn');

  let soundEnabled = true;

  // Control sonido
  soundToggle.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    soundToggle.classList.toggle('active', !soundEnabled);
    soundToggle.setAttribute('aria-pressed', soundEnabled.toString());
  });

  // Abrir modal con contenido
  cards.forEach(card => {
    card.addEventListener('click', () => {
      modalTitle.textContent = card.dataset.title;
      const details = JSON.parse(card.dataset.detail);
      modalDesc.innerHTML = ''; // limpiar contenido

      details.forEach(item => {
        const li = document.createElement('li');
        const h3 = document.createElement('h3');
        h3.textContent = item.title;
        const p = document.createElement('p');
        p.textContent = item.content;
        li.appendChild(h3);
        li.appendChild(p);
        modalDesc.appendChild(li);
      });

      modal.classList.add('active');
      modalClose.focus();

      if(soundEnabled) {
        modalSound.currentTime = 0;
        modalSound.play();
      }
    });
    card.addEventListener('keypress', e => {
      if(e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        card.click();
      }
    });
  });

  // Cerrar modal
  modalClose.addEventListener('click', () => {
    modal.classList.remove('active');
  });
  modal.addEventListener('click', e => {
    if(e.target === modal) {
      modal.classList.remove('active');
    }
  });
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && modal.classList.contains('active')) {
      modal.classList.remove('active');
    }
  });

  // Función filtro cards según texto en buscador
  function filterCards() {
    const query = searchInput.value.toLowerCase();
    const activeFilter = [...filterButtons].find(btn => btn.classList.contains('active'));
    cards.forEach(card => {
      const title = card.dataset.title.toLowerCase();
      const cat = card.dataset.category.toLowerCase();
      const textMatch = title.includes(query) || cat.includes(query);
      const filterMatch = activeFilter.dataset.filter === "all" || cat.includes(activeFilter.dataset.filter);
      if(textMatch && filterMatch) {
        card.style.display = 'flex';
      } else {
        card.style.display = 'none';
      }
    });
  }

  // Buscador input
  searchInput.addEventListener('input', filterCards);

  // Botones filtro
  filterButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      filterButtons.forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-pressed', 'false');
      });
      btn.classList.add('active');
      btn.setAttribute('aria-pressed', 'true');
      filterCards();
    });
  });

  // Inicializo mostrando todos
  filterCards();

</script>
  <script src='https://cdn.jotfor.ms/agent/embedjs/019aaf15263d7b3799a93228af14dc9a216a/embed.js'>
</script>
</body>
</html>
